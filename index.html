<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="三合棋牌">
<meta name="theme-color" content="#0e4429">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>三合棋牌 · 八雀 斗仙 三国</title>
<style>
/* ================= 基础 ================= */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{
  --gold:#ffd76a; --gold-2:#c9962a;
  --btn:#ffcf4a; --btn-2:#f09018;
  /* 现代 UI 用的一套 token */
  --r-lg:16px; --r-md:12px; --r-sm:10px;
  --hair:rgba(255,255,255,.16);          /* 发丝描边 */
  --glass:rgba(255,255,255,.11);         /* 半透明玻璃底 */
  --glass-2:rgba(8,14,20,.52);
  --sh-1:0 1px 2px rgba(0,0,0,.24);
  --sh-2:0 8px 22px -10px rgba(0,0,0,.62);
  --ink:#f2f7f4;
  --red:#d8382f; --red-2:#a8221b;
  --safe-top:max(env(safe-area-inset-top), 26px);   /* 竖屏避开灵动岛 */
  --safe-bot:max(env(safe-area-inset-bottom), 8px);
}
@media (orientation:landscape){ :root{--safe-top:max(env(safe-area-inset-top), 4px)} }
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#0b3a23;color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
#app{position:fixed;inset:0}
.screen{position:absolute;inset:0;display:none;flex-direction:column;
  padding-top:var(--safe-top);padding-bottom:var(--safe-bot);
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.screen.on{display:flex}

/* ================= 三套主题 ================= */
.th-lobby{background:radial-gradient(ellipse at 50% 0%,#1d7a4c,#0a2f1e 70%,#061a11)}
.th-baque{background:radial-gradient(ellipse at 50% 34%,#4f9de0 0%,#1f5fa8 45%,#0d2f5e 100%)}
.th-douxian{background:radial-gradient(ellipse at 50% 26%,#8fb6e6 0%,#3f6aa8 42%,#16264a 100%)}
.th-sanguo{background:radial-gradient(ellipse at 50% 32%,#c8894a 0%,#8a3b22 45%,#3a120a 100%)}

/* ================= 控件 ================= */
/* 按钮：扁平实色，无渐变、无内高光、无投影 */
.btn{border:none;border-radius:10px;padding:10px 20px;
  font-size:15px;font-weight:600;letter-spacing:.2px;line-height:1.2;
  color:#3a2200;background:#ffc93c;box-shadow:none;
  transition:transform .12s ease,background-color .12s ease,opacity .12s ease;
  -webkit-user-select:none;user-select:none;cursor:pointer}
.btn:active{transform:scale(.96);background:#f2b829}
.btn.grey{color:#e9f0ec;background:rgba(255,255,255,.13)}
.btn.grey:active{background:rgba(255,255,255,.22)}
.btn.blue{color:#fff;background:#3d8bfd}
.btn.blue:active{background:#2f77e0}
.btn.red{color:#fff;background:#f0524a}
.btn.red:active{background:#d8433b}
.btn:disabled{opacity:.4;transform:none;cursor:default}
.btn.sm{padding:7px 15px;font-size:13.5px;border-radius:9px}
.btn.xs{padding:5px 11px;font-size:12px;border-radius:8px}
.gold-txt{color:var(--gold);text-shadow:0 1px 0 #7a4f06}
.bean{display:inline-flex;align-items:center;gap:3px}
.bean i{width:13px;height:13px;border-radius:50%;display:inline-block;
  background:radial-gradient(circle at 32% 30%,#fff6c0,#ffcc33 45%,#c98a09);box-shadow:inset 0 -1px 1px rgba(0,0,0,.35)}
.pill{background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:4px 11px;
  font-size:12px;white-space:nowrap}
.spacer{flex:1}

/* ================= 大厅 ================= */
.topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:50px}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;background:linear-gradient(160deg,#ffe08a,#e0a12c);
  border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:19px;overflow:hidden}
.me-info{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.me-info b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32vw}
.lobby-title{text-align:center;margin:4px 0 2px}
.lobby-title h1{font-size:29px;letter-spacing:6px;background:linear-gradient(#fff8d8,#ffd76a 45%,#c9962a);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 #6b4406) drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.lobby-title p{font-size:12px;color:#bfe6cf;letter-spacing:3px;margin-top:2px}
.games{flex:1;overflow-y:auto;padding:10px 14px 14px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.gcard{position:relative;border-radius:14px;padding:14px;min-height:94px;display:flex;align-items:center;gap:12px;
  border:1px solid rgba(255,255,255,.1);overflow:hidden;transition:transform .14s ease}
.gcard:active{transform:scale(.985)}
.gcard.g1{background:linear-gradient(135deg,#3b7fc4,#1b4f8c 60%,#123762)}
.gcard.g2{background:linear-gradient(135deg,#5b7fbf,#2b3f77 60%,#1a2448)}
.gcard.g3{background:linear-gradient(135deg,#a4562c,#6b2415 60%,#3f130b)}
.gcard .emoji{font-size:34px;width:50px;text-align:center;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.gcard .txt{flex:1;min-width:0}
.gcard .txt h3{font-size:18px;letter-spacing:2px;margin-bottom:3px}
.gcard .txt p{font-size:11.5px;color:#e4eef7;opacity:.92;line-height:1.5}
.gcard .tag{position:absolute;top:8px;right:8px;background:rgba(240,82,74,.92);font-size:10px;padding:2px 9px;
  border-radius:999px;font-weight:600;letter-spacing:.5px;z-index:1}
.lobby-foot{display:flex;gap:10px;justify-content:center;padding:0 14px 6px;flex-wrap:wrap}
/* 横屏大厅：三张玩法卡横排铺满 */
body.land .topbar{min-height:42px;padding:4px 12px}
body.land .lobby-title{margin:0}
body.land .lobby-title h1{font-size:23px;letter-spacing:5px}
body.land .lobby-title p{font-size:10px;margin-top:0}
body.land .games{flex-direction:row;gap:10px;padding:6px 12px 6px;overflow:hidden}
body.land .gcard{flex:1;min-width:0;flex-direction:column;align-items:stretch;gap:4px;padding:10px 12px;min-height:0}
body.land .gcard .emoji{font-size:26px;width:auto;text-align:left;line-height:1}
body.land .gcard .txt h3{font-size:16px;margin-bottom:2px}
body.land .gcard .txt p{font-size:10.5px;line-height:1.45}
body.land .gcard .btn{align-self:flex-start;margin-top:2px}
body.land .lobby-foot{padding:0 12px 4px}
body.land .ver-line{padding:0 12px 6px}
body.land .seats{max-width:none}
body.land .seat{width:92px;height:92px}
body.land .match-wrap{gap:10px;padding:8px}
.ver-line{text-align:center;font-size:11px;color:#7fae94;padding:0 14px 10px}
.ver-line #verTag{color:var(--gold);font-weight:700;text-decoration:underline}

/* ================= 匹配 ================= */
.match-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px}
.match-dots::after{content:'';animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:''}25%{content:'·'}50%{content:'··'}75%{content:'···'}}
.seats{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;max-width:330px}
.seat{width:96px;height:104px;border-radius:14px;background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.22);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:#9fc9b1}
.seat.filled{border-style:solid;border-color:rgba(255,255,255,.16);
  background:rgba(255,255,255,.09);color:#fff;animation:pop .3s}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.seat .nm{font-size:12px;max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ================= 牌桌通用（横屏围桌） ================= */
.t-top{display:flex;align-items:center;gap:6px;padding:3px 8px;z-index:6;min-height:32px}
.t-body{flex:1;position:relative;overflow:hidden}
.t-bottom{position:relative;z-index:6;padding:0}
.actbar{display:flex;gap:8px;justify-content:center;align-items:center;min-height:36px;padding:1px 8px;flex-wrap:wrap}
.me-bar{position:absolute;left:6px;bottom:2px;display:flex;align-items:center;gap:6px;font-size:11px;z-index:7}

/* 座位牌 */
.seat-chip{position:absolute;display:flex;align-items:center;gap:6px;z-index:5;
  background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:3px 10px 3px 3px}
.seat-chip.rev{flex-direction:row-reverse;padding:3px 3px 3px 10px}
.seat-chip .av{width:30px;height:30px;border-radius:50%;flex:none;background:linear-gradient(160deg,#ffe08a,#e0a12c);
  border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:15px}
.seat-chip .info{font-size:10.5px;line-height:1.3;min-width:56px;max-width:82px}
.seat-chip.rev .info{text-align:right}
.seat-chip .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat-chip .ex{font-size:9.5px;opacity:.92;white-space:nowrap}
.seat-chip.turn{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 18px -2px rgba(255,215,106,.65)}
.role-badge{position:absolute;left:50%;transform:translateX(-50%);bottom:-8px;font-size:9px;background:var(--red);
  border-radius:6px;padding:0 5px;font-weight:800;white-space:nowrap}
.cardback-count{position:relative;width:22px;height:31px;border-radius:4px;flex:none;
  background:repeating-linear-gradient(45deg,#1d4ed8 0 4px,#1e3a8a 4px 8px);border:2px solid #fff;
  box-shadow:0 2px 4px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000}
.bubble{position:absolute;background:#fff;color:#333;border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700;
  white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.4);z-index:12;animation:pop .18s;top:32px;left:6px}
/* 每家的出牌区 */
.play-slot{position:absolute;display:flex;align-items:center;justify-content:center;gap:0;z-index:3;min-height:32px}
.play-slot .card{margin-left:-14px}
.play-slot .card:first-child{margin-left:0}
/* 中央区域 */
.center-zone{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;width:430px;max-width:60%}

/* 飞牌 / 飞豆动画 */
.fly-layer{position:fixed;inset:0;pointer-events:none;z-index:60;transform:translateZ(0)}
.fly-card{position:fixed;will-change:transform,opacity;backface-visibility:hidden}
.fly-bean{position:fixed;border-radius:50%;will-change:transform,opacity;
  background:radial-gradient(circle at 32% 30%,#fff8d0,#ffcc33 45%,#c98a09);
  box-shadow:0 0 7px rgba(255,205,70,.95),inset 0 -2px 2px rgba(0,0,0,.3)}
/* 起终点光圈：赢家金色、输家红色 */
.pulse-ring{position:fixed;border-radius:14px;pointer-events:none;will-change:transform,opacity;
  border:2px solid rgba(255,215,106,.95)}
.pulse-ring.lose{border-color:rgba(255,120,100,.9);border-style:dashed}

/* ================= 牌 ================= */
.card{position:relative;contain:layout paint;width:var(--cw,46px);height:calc(var(--cw,46px)*1.44);border-radius:5px;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.45);flex:none;color:#222;overflow:hidden;border:1px solid rgba(0,0,0,.15);transition:transform .12s}
.card .c-tl{position:absolute;left:2px;top:1px;font-size:calc(var(--cw,46px)*.34);font-weight:800;line-height:1;text-align:center;width:calc(var(--cw,46px)*.4)}
.card .c-tl small{display:block;font-size:calc(var(--cw,46px)*.3);line-height:1}
.card .c-big{position:absolute;right:3px;bottom:2px;font-size:calc(var(--cw,46px)*.5);line-height:1;opacity:.92}
.card.r{color:#d8382f} .card.b{color:#1a1a1a}
.card.wild{background:linear-gradient(150deg,#fff8cf,#ffd85c);border-color:#c9962a}
.card.wild .c-tl,.card.wild .c-big{color:#a34a06}
.card.chance{background:linear-gradient(150deg,#ffe9cf,#ffb45c);border-color:#c96a2a}
.card.chance .c-tl,.card.chance .c-big{color:#8a3300}
.card.sel{transform:translateY(-15px)}
.card.dim{filter:brightness(.6) saturate(.5)}
/* 上一回合飞升上来的牌：锁定 */
.card.locked{box-shadow:0 0 0 1.5px rgba(255,215,106,.85),0 1px 3px rgba(0,0,0,.45);filter:brightness(.92)}
.card.locked::after{content:'🔒';position:absolute;right:1px;top:0;font-size:8px;opacity:.9;line-height:1}
/* 三国牌：底池（公共区）的牌换个底色 */
.card.pub{background:linear-gradient(150deg,#fff2d2,#ffdc9a);border-color:#c98a2a;
  box-shadow:0 0 0 1.5px rgba(255,190,90,.9),0 1px 3px rgba(0,0,0,.45)}
.card.pub::after{content:'公';position:absolute;left:1px;bottom:0;font-size:8px;color:#8a5a10;font-weight:800;line-height:1}
/* 翻牌 */
.flipper{position:relative;transform-style:preserve-3d;backface-visibility:hidden;will-change:transform}
.reveal-row{display:flex;gap:2px;justify-content:center}
/* 八雀牌中央：牌堆 + 待选底池 */
.deck-area{display:flex;align-items:center;gap:14px;justify-content:center}
.deck-pile{position:relative;cursor:default}
.deck-pile .cardback-count{width:46px;height:66px;font-size:0;border-width:2px}
.deck-pile.hot{cursor:pointer}
.deck-pile.hot .cardback-count{box-shadow:0 0 0 3px var(--gold),0 0 16px rgba(255,215,106,.85)}
.deck-pile .num{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:15px;font-weight:900;
  color:#fff;text-shadow:0 2px 4px #000;pointer-events:none}
.deck-cap{font-size:11px;color:#dbeaff;text-align:center;margin-top:2px}
.pool-area{display:flex;gap:5px;align-items:center}
.pool-area .card{--cw:46px;transition:transform .12s}
.pool-area .card.hot{cursor:pointer;box-shadow:0 0 0 2.5px var(--gold),0 0 14px rgba(255,215,106,.8)}
.pool-area .card.hot:active{transform:translateY(-4px)}
.pool-empty{font-size:11px;color:#9db8dd}
/* 开牌阶段隐藏手牌区，把舞台让给中间的结算动画 */
#table.reveal .t-bottom{display:none}
.card.mini{--cw:28px} .card.tiny{--cw:23px} .card.xs{--cw:19px}
.card .ren{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:70%;height:70%;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#9fe0ff,#2f7fd0 60%,#12447a);color:#fff;font-weight:900;
  display:flex;align-items:center;justify-content:center;font-size:calc(var(--cw,46px)*.42);box-shadow:0 0 6px rgba(80,180,255,.9)}
.hand{display:flex;justify-content:center;align-items:flex-end;padding:0 6px;min-height:78px}
.hand .card{margin-left:var(--ov,-20px)}
.hand .card:first-child{margin-left:0}
.slot{width:30px;height:43px;border-radius:5px;border:1px dashed rgba(255,255,255,.45);background:rgba(255,255,255,.08);flex:none}
.slot.sm{width:24px;height:35px}

.toast-wrap{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);z-index:30;pointer-events:none;max-width:88vw}
.toast{background:rgba(10,16,14,.9);padding:10px 20px;border-radius:12px;font-size:15px;font-weight:600;
  will-change:transform,opacity;border:1px solid rgba(255,255,255,.12);text-align:center}
.bigwin-wrap{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);z-index:31;pointer-events:none}
.bigwin{font-size:32px;font-weight:900;letter-spacing:4px;white-space:nowrap;color:#ffd76a;text-align:center;
  will-change:transform,opacity;text-shadow:0 2px 0 #6b4406,0 4px 12px rgba(0,0,0,.75)}

/* ================= 斗仙牌：三界区域 ================= */
.realms{display:flex;gap:4px;justify-content:center;align-items:flex-start}
.realm{border-radius:10px;padding:3px 4px 4px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13)}
.realm.act{border-color:var(--gold);background:rgba(255,215,106,.2);box-shadow:0 0 0 1px var(--gold),0 0 16px -4px rgba(255,215,106,.6)}
.realm .rn{font-size:10px;text-align:center;line-height:1.3;opacity:.95}
.realm .rs{display:flex;gap:2px}
/* 斗法阶段：牌放大 */
#table.reveal .center-zone{width:352px}
/* 斗法：正在比拼的那一界高亮放大 */
.realm.hot{background:rgba(255,215,106,.2);border-color:var(--gold);
  box-shadow:0 0 0 1px rgba(255,215,106,.7),0 0 16px rgba(255,215,106,.45)}
#table.reveal .realm.hot .rn{font-size:12px;color:var(--gold);font-weight:800}
#table.reveal .realm.hot .pw{font-size:15px;font-weight:900;color:var(--gold);min-height:19px;
  text-shadow:0 1px 3px rgba(0,0,0,.85)}
.realm.cold{opacity:.5}
.pwr-banner.big{padding:2px 16px;font-size:13px}
.pwr-banner.big .v{font-size:16px}
.win-chip{position:absolute;left:50%;top:-9px;transform:translateX(-50%);z-index:8;
  background:linear-gradient(#fff2b8,#ffb32e);color:#5a2f00;font-size:11px;font-weight:900;
  border-radius:999px;padding:1px 9px;white-space:nowrap;pointer-events:none;
  box-shadow:0 2px 8px rgba(0,0,0,.5)}
#table.reveal .realm .rn{font-size:11px}
#table.reveal .realm .pw{font-size:12px;min-height:15px}
.realm .pw{font-size:10px;text-align:center;color:var(--gold);font-weight:800;min-height:13px}
.pw-prev{color:#8fd6ff;text-shadow:0 0 8px rgba(120,200,255,.6)}
.mini-realms{display:flex;gap:3px;flex-wrap:wrap;max-width:186px;justify-content:flex-end}
.mini-realms.lft{justify-content:flex-start}
.mini-realms .realm{padding:1px 2px 2px}
.mini-realms .rn{font-size:9px;line-height:1.1}
.mini-realms .rs{gap:1px}
.slot.sm{width:24px;height:35px}

/* 斗仙牌：斗法横幅 / 名次 / 飘豆动画 */
.pwr-wrap{position:relative;display:flex;justify-content:center;pointer-events:none}
.pwr-banner{display:inline-flex;align-items:center;gap:4px;padding:1px 14px;font-size:11px;font-weight:800;color:#fff;
  background:linear-gradient(90deg,rgba(30,90,170,0) 0%,rgba(90,170,255,.95) 30%,rgba(60,140,235,.95) 70%,rgba(30,90,170,0) 100%);
  clip-path:polygon(0 50%,10px 0,100% 0,calc(100% - 10px) 100%,10px 100%);
  text-shadow:0 1px 3px #000;animation:pop .25s;white-space:nowrap;
  box-shadow:0 0 10px rgba(120,200,255,.7)}
.pwr-banner.win{background:linear-gradient(90deg,rgba(170,100,10,0) 0%,rgba(255,205,90,.98) 30%,rgba(240,150,25,.98) 70%,rgba(170,100,10,0) 100%);
  color:#4a2400;text-shadow:0 1px 2px rgba(255,255,255,.5);box-shadow:0 0 12px rgba(255,200,80,.85)}
.pwr-banner .v{color:#ffe38a;font-size:13px;font-weight:900}
.pwr-banner.win .v{color:#7a2f00}
.rank-badge{width:17px;height:17px;border-radius:50%;font-size:11px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;flex:none}
.rank-big{width:34px;height:34px;font-size:21px}
.reveal-tag{position:relative;display:inline-flex;align-items:center;gap:8px;justify-content:center;
  font-size:20px;font-weight:700;background:rgba(10,16,14,.85);border:1px solid rgba(255,255,255,.14);
  border-radius:12px;padding:4px 14px;white-space:nowrap;will-change:transform,opacity;letter-spacing:.5px}
/* 名次越靠前烧得越旺：--fire 0~1 控制火焰强度。
   火舌用「一角不倒圆角的方块转 45°」做出尖头水滴形，只动 transform/opacity。 */
.flames{position:absolute;inset:-6px -12px -4px;pointer-events:none;overflow:visible;
  opacity:calc(var(--fire,0) * .96)}
.fire-base{position:absolute;inset:-10px -14px -8px;pointer-events:none;border-radius:20px;
  opacity:calc(var(--fire,0) * .55);will-change:transform,opacity;
  background:radial-gradient(62% 82% at 50% 100%,
    rgba(255,190,80,.9) 0%,rgba(255,120,30,.5) 38%,rgba(255,60,0,0) 74%);
  animation:fireBreath 1.05s ease-in-out infinite alternate}
@keyframes fireBreath{from{transform:scale(.97,.9)}to{transform:scale(1.04,1.14)}}
/* 火舌：直接用 clip-path 画出「尖顶圆底」的火焰轮廓，不做旋转，
   只动 transform（scaleY/skew）做摇曳，成本很低 */
.flame{position:absolute;transform-origin:50% 100%;will-change:transform,opacity;
  background:linear-gradient(to top,#fff6cf 0%,#ffd257 20%,#ff9a24 48%,#f4550f 74%,rgba(255,70,0,0) 100%);
  clip-path:polygon(50% 0%,64% 22%,60% 42%,78% 54%,80% 74%,62% 95%,50% 100%,38% 95%,20% 74%,22% 54%,40% 42%,36% 22%);
  animation:flameUp .8s ease-in-out infinite alternate}
@keyframes flameUp{
  0%{transform:scale(.92,.84) skewX(3deg);opacity:.72}
  50%{transform:scale(1,1.12) skewX(-2deg)}
  100%{transform:scale(.96,1.3) skewX(2deg);opacity:1}}
.flame.alt{clip-path:polygon(50% 0%,70% 26%,58% 44%,82% 60%,76% 80%,56% 97%,44% 97%,24% 80%,18% 60%,42% 44%,30% 26%)}
.flame.inner{background:linear-gradient(to top,#ffffff 0%,#fff2b0 26%,#ffc341 60%,rgba(255,150,20,0) 100%);
  opacity:.95;animation-name:flameUpIn}
@keyframes flameUpIn{
  0%{transform:scale(.85,.78) skewX(-3deg);opacity:.6}
  100%{transform:scale(.92,1.18) skewX(3deg);opacity:1}}
.ember{position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 40% 35%,#fff6cf,#ffab35 48%,#ff5c14);
  will-change:transform,opacity;animation:emberUp 1.5s ease-out infinite}
@keyframes emberUp{0%{opacity:0;transform:translate(0,0) scale(.4)}
  16%{opacity:1;transform:translate(calc(var(--ex,0px)*.3),-8px) scale(1)}
  100%{opacity:0;transform:translate(var(--ex,0px),-40px) scale(.2)}}
.reveal-tag.first{border-color:var(--gold);box-shadow:0 0 0 1.5px var(--gold),0 0 26px -6px rgba(255,215,106,.85),
  inset 0 1px 0 rgba(255,255,255,.16)}
.reveal-tag .cn2{font-size:16px;opacity:.85}
/* 牌型名用系统里的楷体/宋体做艺术字，配金色渐变和描边，不下载字体也能离线用 */
.fx-name{font-family:"STKaiti","Kaiti SC","KaiTi","STSong","Songti SC","Songti TC",serif;
  font-weight:700;letter-spacing:2px;
  background:linear-gradient(180deg,#fff6cf 0%,#ffd76a 42%,#e8a11c 78%,#c97f10 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:.6px rgba(70,38,0,.55);
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.55))}
.fx-name.lg{font-size:1.18em}
.reveal-tag .amt{font-size:21px;font-weight:900}
.rk1{background:linear-gradient(#ffe58a,#e0a12c);color:#5a2f00;box-shadow:0 0 8px rgba(255,200,80,.9)}
.rk2{background:linear-gradient(#c8dcff,#5a86c8);color:#0d2140}
.rk3{background:linear-gradient(#ffcaa0,#d07a2a);color:#3a1a00}
.rk4{background:linear-gradient(#d8d8d8,#7a7a7a);color:#222}
.float-wrap{position:absolute;left:50%;top:-14px;transform:translateX(-50%);z-index:22;pointer-events:none}
.float-bean{font-size:26px;font-weight:900;white-space:nowrap;letter-spacing:.5px;opacity:0;
  will-change:transform,opacity;-webkit-text-stroke:1px rgba(0,0,0,.65);text-shadow:0 2px 6px rgba(0,0,0,.95)}
.float-bean .bean i{width:18px;height:18px}
.float-bean.up{color:#7dffae}.float-bean.dn{color:#ff8272}

.zone-line{font-size:10.5px;color:#cfe4ff;letter-spacing:.5px;margin-top:3px}
.zone-line b{color:var(--gold)}

/* ================= 三国牌：阵营 ================= */
.camps{display:flex;gap:6px;justify-content:center;padding:0 6px}
.camp{flex:1;max-width:118px;border-radius:12px;padding:5px 4px 6px;text-align:center;
  border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.3);transition:transform .14s ease}
.camp:active{transform:scale(.97)}
.camp.wei{border-color:#7fb6ff;background:linear-gradient(#2a4f86,#16305a)}
.camp.shu{border-color:#ff8a7a;background:linear-gradient(#8a2f22,#4d1710)}
.camp.wu{border-color:#ffd76a;background:linear-gradient(#8a6a1a,#4d3a0b)}
.camp.act{border-color:var(--gold);box-shadow:0 0 0 1.5px var(--gold),0 0 20px -4px rgba(255,215,106,.75)}
.camp .cn{font-size:12px;font-weight:800;letter-spacing:2px}
.camp .cc{display:flex;gap:2px;justify-content:center;min-height:31px;align-items:center}
.camp .cq{font-size:10px;opacity:.85;white-space:nowrap}
.camp .cbest{font-size:10px;margin-top:2px;color:#ffe6bd;line-height:1.3}
.camp .cbest b{color:#fff}
.camp .cbest b.m{color:var(--gold);font-size:11px}
.camp.reco{box-shadow:0 0 0 1px rgba(255,215,106,.8),0 0 10px rgba(255,215,106,.45)}
.camp.reco.act{box-shadow:0 0 0 2px var(--gold),0 0 14px rgba(255,215,106,.8)}
.reco-tag{font-size:9px;background:var(--red);border-radius:5px;padding:0 4px;font-weight:700;vertical-align:1px}
.tap-reco{color:var(--gold);text-decoration:underline;pointer-events:auto}

/* ================= 弹窗 ================= */
.mask{position:absolute;inset:0;background:rgba(4,10,8,.62);display:none;align-items:center;justify-content:center;z-index:40;padding:14px;
  padding-top:calc(var(--safe-top) + 8px);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.mask.on{display:flex}
.modal{width:100%;max-width:420px;max-height:80vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:#12402b;border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:18px}
.modal h2{text-align:center;font-size:18px;letter-spacing:2px;margin-bottom:10px;color:var(--gold);font-weight:700}
.modal h4{font-size:14px;color:var(--gold);margin:13px 0 6px;padding-left:9px;position:relative}
.modal h4::before{content:'';position:absolute;left:0;top:3px;bottom:3px;width:3px;border-radius:2px;background:var(--gold-2)}
.modal p,.modal li{font-size:13px;line-height:1.7;color:#e2f2e8}
.modal ul{padding-left:18px}
.modal .foot{display:flex;gap:10px;justify-content:center;margin-top:13px;flex-wrap:wrap}
.txt-in{width:100%;box-sizing:border-box;background:rgba(255,255,255,.1);border:1px solid var(--hair);
  border-radius:var(--r-sm);padding:9px 12px;color:#fff;font-size:15px;font-weight:600;
  -webkit-user-select:text;user-select:text;outline:none;font-family:inherit}
.txt-in:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,215,106,.25)}
.row-in{display:flex;gap:8px;align-items:center;margin-top:4px}
table.rt{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
table.rt th,table.rt td{border:1px solid rgba(255,255,255,.12);padding:5px 7px;text-align:left}
table.rt th{background:rgba(255,215,106,.13);color:var(--gold);font-weight:600}
table.rt td:last-child{text-align:right;color:var(--gold);font-weight:700;white-space:nowrap}
.shop-list{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.shop-item{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;
  padding:10px 6px;text-align:center;transition:transform .14s ease}
.shop-item:active{transform:scale(.97);background:rgba(255,255,255,.13)}
.shop-item .amt{font-size:16px;font-weight:800;color:var(--gold);margin:3px 0}
.shop-item .px{font-size:12px;color:#cfe8d8}
.shop-item .bonus{font-size:10px;color:#ffb3a7}
.res-row{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px}
.res-row .d{margin-left:auto;font-weight:800}
.res-row .d.up{color:#7dffb0}.res-row .d.dn{color:#ff9a8f}
</style>
</head>
<body>
<div id="app">
  <section id="lobby" class="screen on th-lobby">
    <div class="topbar">
      <div class="avatar" id="myAvatar">🀄️</div>
      <div class="me-info"><b id="myName" style="cursor:pointer;text-decoration:underline dotted rgba(255,255,255,.35)">游客玩家</b>
        <span class="bean gold-txt"><i></i><span id="myBeans">0</span></span></div>
      <div class="spacer"></div>
      <button class="btn sm" id="btnShop">充 值</button>
      <button class="btn sm grey" id="btnMe">我的</button>
    </div>
    <div class="lobby-title"><h1>三合棋牌</h1><p>八雀 · 斗仙 · 三国</p></div>
    <div class="games">
      <div class="gcard g1" data-game="baque"><div class="tag">经典</div><div class="emoji">🐦</div>
        <div class="txt"><h3>百变八雀牌</h3><p>84 张牌 · 四人摸打 · 8 张成胡<br>癞子／机会牌／硬气，胡牌不离场</p></div>
        <button class="btn sm blue">开始</button></div>
      <div class="gcard g2" data-game="douxian"><div class="tag">策略</div><div class="emoji">☯️</div>
        <div class="txt"><h3>斗仙牌</h3><p>四人独斗 · 凡灵仙三界布阵 · 四回合<br>灵气复苏，灵力差距越大赢越多 · 底分 150</p></div>
        <button class="btn sm blue">开始</button></div>
      <div class="gcard g3" data-game="sanguo"><div class="tag">刺激</div><div class="emoji">🏯</div>
        <div class="txt"><h3>三国牌</h3><p>五人各自为战 · 魏蜀吴公共牌 · 四轮<br>第一名赢所有人，名次 32/24/12/4</p></div>
        <button class="btn sm blue">开始</button></div>
    </div>
    <div class="lobby-foot">
      <button class="btn sm grey" id="btnRulesLobby">玩法说明</button>
      <button class="btn sm grey" id="btnHardReload">强制刷新</button>
      <button class="btn sm grey" id="btnReset">重置数据</button>
    </div>
    <div class="ver-line"><span id="verTag">v—</span> · 点这里看版本信息</div>
  </section>

  <section id="match" class="screen th-lobby">
    <div class="topbar"><button class="btn sm grey" id="btnMatchBack">返回</button><div class="spacer"></div>
      <span class="pill" id="matchGameName"></span></div>
    <div class="match-wrap">
      <div style="font-size:19px;letter-spacing:4px" class="gold-txt"><span id="matchTip">正在匹配对手</span><span class="match-dots"></span></div>
      <div class="seats" id="seats"></div>
      <button class="btn" id="btnMatchStart" disabled>开始游戏</button>
      <button class="btn grey sm" id="btnRematch">换一桌</button>
    </div>
  </section>

  <section id="table" class="screen th-baque">
    <div class="t-top">
      <button class="btn xs grey" id="btnQuit">退出</button>
      <span class="pill" id="tGame">—</span>
      <span class="pill gold-txt" id="tInfo">底分 —</span>
      <div class="spacer"></div>
      <button class="btn xs grey" id="btnRulesTable">规则</button>
    </div>
    <div class="t-body" id="tBody"></div>
    <div class="me-bar">
      <div class="avatar" style="width:24px;height:24px;font-size:12px" id="tMyAvatar">🀄️</div>
      <b id="tMyName">我</b>
      <span class="bean gold-txt"><i></i><span id="tMyBeans">0</span></span>
      <span class="pill" id="tMyExtra" style="font-size:10px;padding:1px 8px"></span>
    </div>
    <div class="t-bottom">
      <div id="myZone"></div>
      <div class="hand" id="myHand"></div>
      <div class="actbar" id="actBar"></div>
    </div>
  </section>

  <div class="mask" id="mask"><div class="modal" id="modal"></div></div>
  <div class="fly-layer" id="flyLayer"></div>
</div>
<script src="js/vendor/motion.js"></script>
<script src="js/core.js"></script>
<script src="js/baque.js"></script>
<script src="js/douxian.js"></script>
<script src="js/sanguo.js"></script>
<script>bootstrap();</script>
</body>
</html>
